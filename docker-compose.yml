# Future-Chat Docker Compose 配置
# 包含 PostgreSQL 数据库和 Next.js 应用
#
# 关于项目名（name:）：它决定了两件东西的最终名字——
#   1. 数据卷：`${项目名}_postgres_data`
#   2. 镜像：`${项目名}-<service>`（不显式写 image: 时）
# 因此项目名从 sky-chat 改成 future-chat 时，**必须先把数据卷迁过去**，
# 否则 compose 会当成一个全新项目、创建一个空卷，现有数据"看起来"就丢了
# （数据其实还在旧卷 sky-chat_postgres_data 里，只是没被挂载）。
# 本次迁移的实际做法见 README「Docker 相关注意点」。

name: future-chat

services:
  # PostgreSQL 数据库（带 pgvector 扩展）
  #
  # 镜像从 postgres:16-alpine 换成 pgvector/pgvector:pg16：
  # 官方 postgres 镜像不含 pgvector 扩展，而 RAG 的向量检索要在 SQL 里算余弦距离
  # 并走 HNSW 索引，必须有 vector 类型。pgvector 官方镜像就是 postgres 官方镜像
  # 加装扩展，版本号（pg16）与原来一致，数据卷可以继续用，不需要重建数据。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: future-chat-postgres
    restart: unless-stopped
    environment:
      # 注意：POSTGRES_* 只在「数据卷为空、首次初始化」时生效。

      POSTGRES_USER: future_chat
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: future_chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U future_chat']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: future-chat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://future_chat:password123@postgres:5432/future_chat"
      NODE_ENV: production
    env_file:
      - path: .env
        required: true
      - path: .env.production
        required: false
    volumes:
      - ./generated:/app/public/generated
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # 声明为 external：这个卷是「手工迁移」出来的（从 sky-chat_postgres_data 逐文件复制），
  # 不带 compose 自己的标签。不声明 external 时 compose 会警告
  # "volume was not created by Docker Compose"，并在极端情况下按自己的理解重建它——
  # 对数据库卷来说那等于数据全丢。显式声明后 compose 只负责挂载，不负责创建/删除。
  postgres_data:
    external: true
    name: future-chat_postgres_data
